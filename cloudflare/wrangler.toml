name = "poultrysuite-api"
main = "worker/index.js"
compatibility_date = "2024-12-01"

[vars]
CORS_ORIGIN = "https://poultrysuite.agorox.africa"
# JWT_SECRET and PAYSTACK_SECRET_KEY are set via `wrangler secret put`
# (see below) — NOT stored here, since this file gets committed to git.

[[d1_databases]]
binding = "DB"
database_name = "poultrysuite-db"
database_id = "9f0ae947-5094-4dc1-8749-6058d4303b51"

[[r2_buckets]]
binding = "ADMIN_DOCS"
bucket_name = "poultrysuite-admin-docs"